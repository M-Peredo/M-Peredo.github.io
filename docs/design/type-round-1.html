<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molly's Type Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Serif:ital@0;1&family=Young+Serif&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Voltaire&family=Inter:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+Antique:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Ovo&family=Mulish:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800&family=Karla:wght@400;500;600;700&family=Zain:wght@400;700;800&family=Nunito:wght@400;500;600;700&display=swap">
<style>
:root { --c-bg: #101012; --c-panel: #17171a; --c-line: #2b2b30; --c-ink: #f2f2f3; --c-muted: #a4a4ab; --c-accent: #8ab4ff; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--c-bg); color: var(--c-ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, select, textarea { font: inherit; color: inherit; }
:where(button, select, textarea):focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

.pager { border-bottom: 1px solid var(--c-line); background: var(--c-panel); flex: none; }
.pager-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 18px; }
.pager h1 { font-size: 15px; margin: 0; white-space: nowrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.tab { appearance: none; border: 1px solid transparent; background: transparent; color: var(--c-muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13.5px; }
.tab:hover { color: var(--c-ink); }
.tab[aria-current="page"] { color: var(--c-ink); border-color: var(--c-ink); font-weight: 600; }
.tab small { color: var(--c-muted); margin-left: 4px; font-weight: 400; }
.nav { display: flex; gap: 6px; align-items: center; }
.count { color: var(--c-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn { appearance: none; border: 1px solid #3a3a40; background: #26262a; padding: 7px 13px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--c-accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn[aria-pressed="true"] { background: var(--c-ink); color: #101012; border-color: var(--c-ink); }

main { flex: 1; min-height: 0; }
.page { height: 100%; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 18px; padding: 18px; }
.side { overflow: auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; padding-right: 4px; }
.stage { overflow: auto; min-width: 0; border-radius: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--c-muted); font-weight: 700; }
.side h2 { margin: 0; font-size: 26px; line-height: 1.15; }
.note { margin: 0; color: var(--c-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stars { display: flex; gap: 2px; align-items: center; }
.stars .label { font-size: 12px; color: var(--c-muted); width: 52px; }
.star { appearance: none; border: 0; background: none; padding: 2px; font-size: 24px; line-height: 1; cursor: pointer; color: var(--c-line); }
.star.on { color: var(--c-ink); }
.controls { display: grid; gap: 12px; border-top: 1px solid var(--c-line); padding-top: 14px; }
.field { display: grid; gap: 4px; }
.field label, .field .l { font-size: 12px; color: var(--c-muted); }
textarea, select { width: 100%; background: #0d0d0f; border: 1px solid var(--c-line); border-radius: 6px; padding: 8px 10px; }
textarea { min-height: 70px; resize: vertical; }

.summary { overflow: auto; padding: 20px; height: 100%; }
.summary-inner { max-width: 960px; margin: 0 auto; display: grid; gap: 18px; }
.summary h2 { margin: 0; font-size: 26px; }
.compare { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.cmp { text-align: left; background: var(--c-panel); border: 1px solid var(--c-line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; }
.cmp b { font-size: 18px; }
.cmp small { color: var(--c-muted); }
.cmp.liked { border-color: var(--c-accent); }
pre { margin: 0; white-space: pre-wrap; background: var(--c-panel); border: 1px solid var(--c-line); border-radius: 8px; padding: 14px; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { color: var(--c-muted); font-size: 13px; }

/* ---- Specimen: a mini case study page. Fonts come from the variables below. ---- */
.spec { --fd: Georgia, serif; --fb: system-ui, sans-serif; --dw: 600; --dls: 0; --qs: italic;
  background: #0b0b0c; color: #f2f2f3; padding: clamp(24px, 4vw, 48px); border-radius: 10px; font-family: var(--fb); font-size: 1.0625rem; line-height: 1.65; display: grid; gap: 22px; align-content: start; }
.spec .eb { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: #a4a4ab; font-weight: 700; }
.spec .glyphs { font-family: var(--fd); font-weight: var(--dw); font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1.1; letter-spacing: var(--dls); color: #f2f2f3; word-break: break-word; }
.spec .glyphs small { display: block; font-family: var(--fb); font-weight: 400; font-size: 1.05rem; letter-spacing: .02em; color: #a4a4ab; margin-top: 6px; }
.spec h3 { font-family: var(--fd); font-weight: var(--dw); letter-spacing: var(--dls); font-size: clamp(2rem, 4.4vw, 3.3rem); line-height: 1.08; margin: 0; max-width: 20ch; text-wrap: balance; }
.spec .lede { margin: 0; font-size: 1.25rem; line-height: 1.5; color: #a4a4ab; max-width: 52ch; }
.spec .metrics { display: flex; flex-wrap: wrap; gap: 20px 48px; padding-block: 8px; border-block: 2px solid #4a44c6; }
.spec .metric { display: grid; gap: 2px; padding-block: 12px; }
.spec .metric b { font-family: var(--fd); font-weight: var(--dw); font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; letter-spacing: var(--dls); font-variant-numeric: lining-nums tabular-nums; }
.spec .metric span { font-size: .875rem; color: #a4a4ab; }
.spec h4 { font-family: var(--fd); font-weight: var(--dw); letter-spacing: var(--dls); font-size: clamp(1.5rem, 2.8vw, 2rem); line-height: 1.15; margin: 8px 0 0; max-width: 30ch; }
.spec p { margin: 0; max-width: 62ch; color: #ddddde; }
.spec blockquote { margin: 0; border-left: 3px solid #4a44c6; padding-left: 18px; font-family: var(--fd); font-style: var(--qs); font-weight: 500; font-size: 1.55rem; line-height: 1.35; max-width: 34ch; }
.spec cite { display: block; margin-top: 8px; font-family: var(--fb); font-style: normal; font-size: .85rem; color: #a4a4ab; }
.spec .box { background: #29256d; border: 1px solid #4a44c6; border-radius: 14px; padding: 22px 26px; display: grid; gap: 8px; color: #fff; }
.spec .box .eb { color: rgba(255,255,255,.75); }
.spec .box p { color: rgba(255,255,255,.92); }
.spec .btns { display: flex; flex-wrap: wrap; gap: 12px; }
.spec .b1, .spec .b2 { font-family: var(--fb); font-weight: 700; font-size: .97rem; padding: .9em 1.4em; border-radius: 8px; border: 2px solid #f2f2f3; }
.spec .b1 { background: #f2f2f3; color: #0b0b0c; }
.spec .b2 { color: #f2f2f3; }
.spec .small { font-size: .875rem; color: #a4a4ab; }
.spec ul { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; color: #ddddde; max-width: 56ch; }

@media (max-width: 900px) { html, body { height: auto; } body { display: block; } .pager { position: sticky; top: 0; z-index: 2; } .page { height: auto; grid-template-columns: 1fr; } .side, .stage { overflow: visible; } .summary { height: auto; } }
</style>
</head>
<body>

<header class="pager">
  <div class="pager-inner">
    <h1>Type, round 2</h1>
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="nav">
      <span class="count" id="count"></span>
      <button class="btn" id="prev" type="button">← Prev</button>
      <button class="btn" id="next" type="button">Next →</button>
    </div>
  </div>
</header>
<main id="main"></main>

<script>
const ROUND = 2;
const KEY = "molly-type-round-" + ROUND;

// cat: serif or sans. dw = heading weight. ital = has a real italic (used for the quote).
const FONTS = [
  { id: "voltaire", name: "Voltaire", cat: "Sans", f: '"Voltaire", system-ui, sans-serif', dw: 400, dls: "0", ital: false, body: false },
  { id: "inter", name: "Inter", cat: "Sans", f: '"Inter", system-ui, sans-serif', dw: 700, dls: "-0.015em", ital: false, body: true },
  { id: "urbanist", name: "Urbanist", cat: "Sans", f: '"Urbanist", system-ui, sans-serif', dw: 700, dls: "-0.01em", ital: false, body: true },
  { id: "opensans", name: "Open Sans", cat: "Sans", f: '"Open Sans", system-ui, sans-serif', dw: 700, dls: "-0.01em", ital: false, body: true },
  { id: "zenanti", name: "Zen Kaku Gothic Antique", cat: "Sans", f: '"Zen Kaku Gothic Antique", system-ui, sans-serif', dw: 700, dls: "0", ital: false, body: true },
  { id: "zennew", name: "Zen Kaku Gothic New", cat: "Sans", f: '"Zen Kaku Gothic New", system-ui, sans-serif', dw: 700, dls: "0", ital: false, body: true },
  { id: "ovo", name: "Ovo", cat: "Serif", f: '"Ovo", Georgia, serif', dw: 400, dls: "0", ital: false, body: false },
  { id: "mulish", name: "Mulish", cat: "Sans", f: '"Mulish", system-ui, sans-serif', dw: 700, dls: "-0.01em", ital: false, body: true },
  { id: "rubik", name: "Rubik", cat: "Sans", f: '"Rubik", system-ui, sans-serif', dw: 700, dls: "-0.015em", ital: false, body: true },
  { id: "karla", name: "Karla", cat: "Sans", f: '"Karla", system-ui, sans-serif', dw: 700, dls: "-0.01em", ital: false, body: true },
  { id: "zain", name: "Zain", cat: "Sans", f: '"Zain", system-ui, sans-serif', dw: 800, dls: "0", ital: false, body: false },
  { id: "nunito", name: "Nunito", cat: "Sans", f: '"Nunito", system-ui, sans-serif', dw: 700, dls: "-0.01em", ital: false, body: true },
  { id: "fraunces", name: "Fraunces", cat: "Serif", f: '"Fraunces", Georgia, serif', dw: 600, dls: "-0.01em", ital: true, body: false },
  { id: "instrument", name: "Instrument Serif", cat: "Serif", f: '"Instrument Serif", Georgia, serif', dw: 400, dls: "0", ital: true, body: false },
  { id: "young", name: "Young Serif", cat: "Serif", f: '"Young Serif", Georgia, serif', dw: 400, dls: "0", ital: false, body: false },
  { id: "newsreader", name: "Newsreader", cat: "Serif", f: '"Newsreader", Georgia, serif', dw: 600, dls: "-0.01em", ital: true, body: false },
  { id: "atkinson", name: "Atkinson Hyperlegible Next", cat: "Sans", f: '"Atkinson Hyperlegible Next", system-ui, sans-serif', dw: 700, dls: "-0.01em", ital: false, body: true },
  { id: "bricolage", name: "Bricolage Grotesque", cat: "Sans", f: '"Bricolage Grotesque", system-ui, sans-serif', dw: 700, dls: "-0.02em", ital: false, body: true },
  { id: "figtree", name: "Figtree", cat: "Sans", f: '"Figtree", system-ui, sans-serif', dw: 700, dls: "-0.015em", ital: false, body: true },
  { id: "sora", name: "Sora", cat: "Sans", f: '"Sora", system-ui, sans-serif', dw: 600, dls: "-0.02em", ital: false, body: true },
];
// Font names go into inline style attributes, so use single quotes.
FONTS.forEach(f => { f.f = f.f.replace(/"/g, "'"); });
const BY = Object.fromEntries(FONTS.map(f => [f.id, f]));

// Molly's six pairings: heading font + body font
const PAIRS = [
  { h: "voltaire", b: "inter", short: "Voltaire + Inter", note: "Tall, condensed headlines over a clean, neutral body. Newspaper-poster energy." },
  { h: "urbanist", b: "opensans", short: "Urbanist + Open Sans", note: "Geometric, rounded headlines over a friendly, open body." },
  { h: "zenanti", b: "zennew", short: "Zen Kaku Antique + New", note: "One family in two cuts. Calm and slightly retro." },
  { h: "ovo", b: "mulish", short: "Ovo + Mulish", note: "A warm old-style serif for headlines over a soft, rounded sans. The only serif heading in the set." },
  { h: "rubik", b: "karla", short: "Rubik + Karla", note: "Chunky, soft-cornered headlines over a quirky grotesque body." },
  { h: "zain", b: "nunito", short: "Zain + Nunito", note: "Soft, friendly headlines over a rounded body. The gentlest set." },
];
const PAGES = [...PAIRS.map((p, i) => "pair" + i), "mix", "summary"];
const REF_D = "Georgia, 'Times New Roman', serif", REF_B = "system-ui, -apple-system, 'Segoe UI', sans-serif";

function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load() || {};
state.mix = state.mix || { h: "fraunces", b: "figtree" }; state.picks = state.picks || {}; state.page = state.page ?? 0;
if (!(state.page >= 0 && state.page < PAGES.length)) state.page = 0;
const keyOf = (h, b) => h + "+" + b;
const pick = (h, b) => state.picks[keyOf(h, b)] || (state.picks[keyOf(h, b)] = { rating: 0, kept: false, notes: "" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function specimen(d, b, label) {
  const qs = d.ital ? "italic" : "normal";
  return `
  <div class="spec" style="--fd:${d.f};--fb:${b.f};--dw:${d.dw};--dls:${d.dls};--qs:${qs}">
    <div class="eb">${esc(label)}</div>
    <div class="glyphs">Aa Bb Cc 123<small>ABCDEFGHIJKLMNOPQRSTUVWXYZ · abcdefghijklmnopqrstuvwxyz · 0123456789 &amp; ? !</small></div>
    <div class="eb" style="margin-top:8px">Teaching Assistant · 2023–2026</div>
    <h3>Building an AI teaching assistant teachers trust</h3>
    <p class="lede">Three years of small bets that added up to one platform-wide tool for K-12 classrooms.</p>
    <div class="metrics">
      <div class="metric"><b>38%</b><span>of teachers using it weekly</span></div>
      <div class="metric"><b>4.6</b><span>average teacher rating</span></div>
      <div class="metric"><b>2×</b><span>faster lesson setup</span></div>
    </div>
    <h4>The hard call: what we left out of the MVP</h4>
    <p>Grading support was the feature teachers asked for most, and the riskiest one to get wrong. We shipped without it and shaped the data model so it could arrive as a fast follow, without moving anything teachers had already learned.</p>
    <p>Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.</p>
    <blockquote>“It finally feels like it's working for me, not the other way around.”<cite>Middle school CS teacher, pilot interview</cite></blockquote>
    <div class="box"><span class="eb">Key insight</span><p>Teachers trusted the tool once they could see why it suggested what it did, and once they could always change its answer.</p></div>
    <ul><li>Lorem ipsum dolor sit amet, consectetur adipiscing elit</li><li>Sed do eiusmod tempor incididunt ut labore et dolore</li><li>Ut enim ad minim veniam, quis nostrud exercitation</li></ul>
    <div class="btns"><span class="b1">Try the prototype →</span><span class="b2">Read the case study</span></div>
    <p class="small">Caption: small text sits under figures and tables. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>`;
}

const controls = (id, ph) => `
  <div class="controls">
    <div class="stars" role="group" aria-label="Rate this pairing"><span class="label">Rating</span>${[1,2,3,4,5].map(n => `<button type="button" class="star" data-star="${n}" aria-label="${n} of 5">★</button>`).join("")}</div>
    <button type="button" class="btn" data-keep aria-pressed="false">Keep this pairing</button>
    <div class="field"><label for="n-${id}">Notes</label><textarea id="n-${id}" placeholder="${ph}"></textarea></div>
  </div>`;

function pairPage(p, i) {
  const h = BY[p.h], b = BY[p.b];
  return `
  <section class="page" data-pair="${i}">
    <div class="side">
      <span class="eyebrow">Pairing ${i + 1} of ${PAIRS.length}</span>
      <h2 style="font-family:${h.f};font-weight:${h.dw}">${esc(h.name)} <span style="font-family:${b.f};font-weight:400;color:var(--c-muted)">&amp; ${esc(b.name)}</span></h2>
      <p class="note">${esc(p.note)}</p>
      ${controls("p" + i, "What works, what doesn't")}
    </div>
    <div class="stage" data-spec>${specimen(h, b, `${h.name} headings + ${b.name} body`)}</div>
  </section>`;
}

function mixPage() {
  const heads = FONTS.map(f => `<option value="${f.id}">${esc(f.name)} (${f.cat.toLowerCase()})</option>`).join("");
  const bodies = FONTS.filter(f => f.body).map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("");
  return `
  <section class="page" data-mix>
    <div class="side">
      <span class="eyebrow">Mix and match</span>
      <h2>Pick a pairing</h2>
      <p class="note">Headings can be any font, serif or sans. Body text is limited to sans-serifs.</p>
      <div class="field"><label for="mixh">Headings and numbers</label><select id="mixh">${heads}</select></div>
      <div class="field"><label for="mixb">Body text (sans only)</label><select id="mixb">${bodies}</select></div>
      ${controls("mix", "Why this one")}
    </div>
    <div class="stage" data-mixspec></div>
  </section>`;
}

function summaryPage() {
  return `
  <section class="summary" data-summary><div class="summary-inner">
    <h2>Summary</h2>
    <div class="compare" id="cmp"></div>
    <pre id="sumtext"></pre>
    <div class="row"><button class="btn" id="copy" type="button">Copy summary</button><button class="btn" id="reset" type="button">Start over</button><span class="msg" id="msg"></span></div>
  </div></section>`;
}

const main = document.getElementById("main");
main.innerHTML = PAIRS.map(pairPage).join("") + mixPage() + summaryPage();
const els = [...main.children];
const MIXI = PAIRS.length;

function fill(el, p) {
  el.querySelectorAll(".star").forEach(b => b.classList.toggle("on", Number(b.dataset.star) <= p.rating));
  el.querySelector("[data-keep]").setAttribute("aria-pressed", String(p.kept));
  const ta = el.querySelector("textarea"); if (document.activeElement !== ta && ta.value !== p.notes) ta.value = p.notes;
}

function render() {
  els.forEach((el, i) => el.hidden = i !== state.page);
  document.getElementById("count").textContent = `${state.page + 1} / ${PAGES.length}`;
  document.getElementById("prev").disabled = state.page === 0;
  document.getElementById("next").disabled = state.page === PAGES.length - 1;
  document.getElementById("tabs").innerHTML = PAGES.map((id, i) => {
    const cur = i === state.page ? ' aria-current="page"' : "";
    if (id === "summary") return `<button class="tab" type="button" data-go="${i}"${cur}>Summary</button>`;
    if (id === "mix") return `<button class="tab" type="button" data-go="${i}"${cur}>Mix and match</button>`;
    const pr = PAIRS[i], k = pick(pr.h, pr.b);
    return `<button class="tab" type="button" data-go="${i}"${cur}>${esc(pr.short)}${k.rating ? `<small>${k.rating}/5</small>` : ""}${k.kept ? "<small>✓</small>" : ""}</button>`;
  }).join("");

  PAIRS.forEach((pr, i) => fill(els[i], pick(pr.h, pr.b)));

  const mel = els[MIXI], sig = keyOf(state.mix.h, state.mix.b), stage = mel.querySelector("[data-mixspec]");
  if (stage.dataset.sig !== sig) { stage.dataset.sig = sig; stage.innerHTML = specimen(BY[state.mix.h], BY[state.mix.b], `${BY[state.mix.h].name} headings + ${BY[state.mix.b].name} body`); }
  mel.querySelector("#mixh").value = state.mix.h; mel.querySelector("#mixb").value = state.mix.b;
  fill(mel, pick(state.mix.h, state.mix.b));
  renderSummary();
}

function renderSummary() {
  const label = k => { const [h, b] = k.split("+"); return `${BY[h].name} + ${BY[b].name}`; };
  const fixed = PAIRS.map(p => keyOf(p.h, p.b));
  const extra = Object.keys(state.picks).filter(k => !fixed.includes(k) && (state.picks[k].rating || state.picks[k].kept || state.picks[k].notes.trim()));
  const all = [...fixed, ...extra];
  document.getElementById("cmp").innerHTML = all.map(k => {
    const [h, b] = k.split("+"), v = state.picks[k] || { rating: 0, kept: false, notes: "" }, i = fixed.indexOf(k);
    return `<button class="cmp ${v.kept ? "liked" : ""}" type="button" ${i >= 0 ? `data-go="${i}"` : `data-mix="${k}"`}><b style="font-family:${BY[h].f};font-weight:${BY[h].dw}">${esc(BY[h].name)} <span style="font-family:${BY[b].f};font-weight:400;color:var(--c-muted)">+ ${esc(BY[b].name)}</span></b><small>${v.rating ? v.rating + "/5" : "unrated"}${v.kept ? " · kept" : ""}</small><small>${esc(v.notes.trim())}</small></button>`;
  }).join("");
  const lines = [`Type, round ${ROUND}`, "", "PAIRINGS (headings + body)"];
  all.forEach(k => { const v = state.picks[k] || { rating: 0, kept: false, notes: "" }; lines.push(`- ${label(k)}: ${v.rating ? v.rating + "/5" : "unrated"}${v.kept ? ", KEPT" : ""}${v.notes.trim() ? "\n    Notes: " + v.notes.trim().replace(/\n+/g, " / ") : ""}`); });
  document.getElementById("sumtext").textContent = lines.join("\n");
}

function go(i) { state.page = Math.max(0, Math.min(PAGES.length - 1, i)); save(); render(); els[state.page].querySelectorAll(".side, .stage, .summary").forEach(s => s.scrollTop = 0); window.scrollTo(0, 0); }
document.getElementById("prev").addEventListener("click", () => go(state.page - 1));
document.getElementById("next").addEventListener("click", () => go(state.page + 1));
document.addEventListener("keydown", e => { if (e.target.closest("textarea, select")) return; if (e.key === "ArrowRight") go(state.page + 1); if (e.key === "ArrowLeft") go(state.page - 1); });

// Which pairing a control belongs to
function targetOf(el) {
  const pg = el.closest("[data-pair]");
  if (pg) { const p = PAIRS[Number(pg.dataset.pair)]; return pick(p.h, p.b); }
  if (el.closest("[data-mix]")) return pick(state.mix.h, state.mix.b);
  return null;
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-mix]:not(section)");
  if (m) { const [h, b] = m.dataset.mix.split("+"); state.mix = { h, b }; return go(MIXI); }
  const g = e.target.closest("[data-go]"); if (g) return go(Number(g.dataset.go));
  const tgt = targetOf(e.target); if (!tgt) return;
  const st = e.target.closest("[data-star]"), kp = e.target.closest("[data-keep]");
  if (st) { const n = Number(st.dataset.star); tgt.rating = tgt.rating === n ? 0 : n; }
  else if (kp) tgt.kept = !tgt.kept;
  else return;
  save(); render();
});
document.addEventListener("change", e => {
  if (e.target.id === "mixh") { state.mix.h = e.target.value; save(); render(); }
  if (e.target.id === "mixb") { state.mix.b = e.target.value; save(); render(); }
});
let t;
document.addEventListener("input", e => {
  const ta = e.target.closest("textarea"); if (!ta) return;
  const tgt = targetOf(ta); if (tgt) tgt.notes = ta.value;
  clearTimeout(t); t = setTimeout(() => { save(); render(); }, 400);
});
document.getElementById("copy").addEventListener("click", async () => {
  const pre = document.getElementById("sumtext"), msg = document.getElementById("msg");
  try { await navigator.clipboard.writeText(pre.textContent); msg.textContent = "Copied. Paste it into the chat."; }
  catch (err) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Selected. Press Cmd+C."; }
});
let armed = false;
document.getElementById("reset").addEventListener("click", e => {
  if (!armed) { armed = true; e.target.textContent = "Click again to clear everything"; setTimeout(() => { armed = false; e.target.textContent = "Start over"; }, 4000); return; }
  armed = false; e.target.textContent = "Start over"; state = { mix: { h: "fraunces", b: "figtree" }, picks: {}, page: state.page };
  els.forEach(el => { el.querySelectorAll("textarea").forEach(x => x.value = ""); });
  save(); render(); document.getElementById("msg").textContent = "Cleared.";
});
render();
</script>
</body>
</html>
